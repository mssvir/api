name: Publish canonical MSSV API v1 documentation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-canonical-api-v1-docs.yml'

permissions:
  contents: write

concurrency:
  group: publish-canonical-api-v1-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Build and validate documentation update
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def rep(text: str, old: str, new: str) -> str:
              return text.replace(old, new)

          site='[www.mssv.ir](https://www.mssv.ir/)'
          client='[MSSV client area](https://my.mssv.ir/)'
          tokens='[Machine API token management](https://my.mssv.ir/machine-users/)'
          login='[MSSV client area sign-in](https://my.mssv.ir/login/)'

          # README
          p='README.md'; s=read(p)
          s=rep(s,'[![Website](https://img.shields.io/badge/Website-mssv.ir-0b7285)](https://mssv.ir/)',
                '[![Website](https://img.shields.io/badge/Website-www.mssv.ir-0b7285)](https://www.mssv.ir/)')
          s=rep(s,'[![API](https://img.shields.io/badge/API-api.mssv.ir-2f9e44)](https://api.mssv.ir/)',
                '[![API](https://img.shields.io/badge/API-api.mssv.ir%2Fv1-2f9e44)](https://api.mssv.ir/v1/)')
          s=rep(s,'**Official website:** https://mssv.ir/',f'**Official website:** {site}')
          s=rep(s,'**API base URL:** `https://api.mssv.ir/api/machine/v1`','**API base URL:** `https://api.mssv.ir/v1/`')
          s=rep(s,'https://api.mssv.ir/api/machine/v1/me','https://api.mssv.ir/v1/me')
          s=rep(s,'Create a Machine API token from your MSSV client account, assign at least one allowed IPv4/IPv6 address or CIDR range to that token, then send it as a Bearer token from an allowed source address:',
                f'Create a Machine API token from {tokens}, assign at least one allowed IPv4/IPv6 address or CIDR range to that token, then send it as a Bearer token from an allowed source address:')
          s=rep(s,'- versioned paths under `/api/machine/v1`','- versioned paths under `/v1/`')
          s=rep(s,'Customers can update the allowed IP/CIDR list for an active Machine API token from the authenticated MSSV client area. Origin allowlist reconciliation is automatic.',
                f'Customers can update the allowed IP/CIDR list for an active Machine API token from {tokens}. Origin allowlist reconciliation is automatic.')
          s=rep(s,'**[mssv.ir](https://mssv.ir/)**',f'**{site}**')
          write(p,s)

          # Getting started
          p='docs/getting-started.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,'https://api.mssv.ir/api/machine/v1\n```','https://api.mssv.ir/v1/\n```')
          s=rep(s,'Sign in to your MSSV client account and create a Machine API token from the API token management page. Token creation requires a current-password check. The token is displayed once, so store it securely.',
                f'Open {tokens}. If you are not signed in, use the {login}. After successful login and any required account verification, MSSV returns you to the internal page you originally requested. Token creation requires a current-password check. The token is displayed once, so store it securely.')
          s=rep(s,'You can later edit the token name, scopes and allowed IP/CIDR list from the authenticated MSSV client area without rotating the token. Allowlist reconciliation at the API origin is automatic.',
                f'You can later edit the token name, scopes and allowed IP/CIDR list from {tokens} without rotating the token. Allowlist reconciliation at the API origin is automatic.')
          s=rep(s,'https://api.mssv.ir/api/machine/v1/','https://api.mssv.ir/v1/')
          s=rep(s,'For current MSSV product and service information, visit https://mssv.ir/.',f'For current MSSV product and service information, visit {site}.')
          write(p,s)

          # Authentication
          p='docs/authentication.md'; s=read(p)
          s=rep(s,'Base URL: `https://api.mssv.ir/api/machine/v1`','Base URL: `https://api.mssv.ir/v1/`')
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,'Machine API tokens are issued from the authenticated MSSV client area and are shown only once at creation time.',
                f'Machine API tokens are issued from {tokens} and are shown only once at creation time.')
          s=rep(s,'The token owner can edit its name, scopes and IP/CIDR allowlist from the authenticated MSSV client area. These changes are audited and the origin allowlist is reconciled automatically.',
                f'The token owner can edit its name, scopes and IP/CIDR allowlist from {tokens}. These changes are audited and the origin allowlist is reconciled automatically.')
          s=rep(s,'Official MSSV website: https://mssv.ir/',f'Official MSSV website: {site}')
          write(p,s)

          # Errors
          p='docs/errors.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,'API base URL: `https://api.mssv.ir/api/machine/v1`','API base URL: `https://api.mssv.ir/v1/`')
          write(p,s)

          # API reference
          p='docs/api-reference.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,'Base URL: `https://api.mssv.ir/api/machine/v1`','Base URL: `https://api.mssv.ir/v1/`')
          s=rep(s,'Those capabilities require an authenticated human browser session.',
                f'Those capabilities require an authenticated browser session in the {client}.')
          s=rep(s,'The customer can edit this allowlist from the MSSV client area.',
                f'The customer can edit this allowlist from {tokens}.')
          write(p,s)

          # Versioning
          p='docs/versioning.md'; s=read(p)
          s=rep(s,'https://mssv.ir/api/machine/v1','https://api.mssv.ir/v1/')
          s=rep(s,'https://api.mssv.ir/api/machine/v1','https://api.mssv.ir/v1/')
          if '## Legacy path compatibility' not in s:
              marker='## Compatibility\n'
              block=(
                  '## Legacy path compatibility\n\n'
                  'The previous `/api/machine/v1` path is retained as a method-preserving HTTP `308` redirect to the canonical `/v1/` path. '
                  'New integrations should use `https://api.mssv.ir/v1/` directly.\n\n'
              )
              if marker not in s:
                  raise SystemExit('versioning compatibility anchor missing')
              s=s.replace(marker,block+marker,1)
          s=rep(s,'The official MSSV website is https://mssv.ir/.',f'The official MSSV website is {site}.')
          write(p,s)

          # cURL examples
          p='examples/curl.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,"export MSSV_API_BASE='https://api.mssv.ir/api/machine/v1'","export MSSV_API_BASE='https://api.mssv.ir/v1'")
          s=rep(s,"update the Machine API token's IP/CIDR allowlist from the authenticated MSSV client area before sending requests from the new address.",
                f"update the Machine API token's IP/CIDR allowlist from {tokens} before sending requests from the new address.")
          s=rep(s,'For product, hosting and account access information, visit https://mssv.ir/.',f'For product, hosting and account access information, visit {site}.')
          write(p,s)

          # Security
          p='SECURITY.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,'Use the official MSSV website and support channels at https://mssv.ir/ to report security-sensitive issues privately.',
                f'Use the support channels available through {site} to report security-sensitive issues privately.')
          s=rep(s,'- Use the optional IP/CIDR allowlist where practical.','- Keep the mandatory IP/CIDR allowlist restricted to the smallest practical source range.')
          s=rep(s,'- Revoke tokens that are no longer needed.',f'- Manage and revoke tokens that are no longer needed from {tokens}.')
          write(p,s)

          # Citation metadata
          p='CITATION.cff'; s=read(p)
          s=rep(s,'version: 1.0.0','version: 1.1.0')
          s=rep(s,'url: https://mssv.ir/','url: https://www.mssv.ir/')
          write(p,s)

          # Changelog. Historical entries may mention the superseded path, so
          # only the current header is canonicalized and a new migration entry is added.
          p='CHANGELOG.md'; s=read(p)
          s=rep(s,'The public API is served from `https://api.mssv.ir/api/machine/v1`.','The public API is served from `https://api.mssv.ir/v1/`.')
          if 'Canonical `/v1/` base path and client return flow' not in s:
              anchor='The public API is served from `https://api.mssv.ir/v1/`.\n\n'
              block=(
                  '## 2026-09-17 — Canonical `/v1/` base path and client return flow\n\n'
                  '- Changed the canonical public Machine API base URL to `https://api.mssv.ir/v1/`.\n'
                  '- Kept `/api/machine/v1` as a method-preserving HTTP `308` compatibility redirect to `/v1/`.\n'
                  f'- Standardized official website links to {site}.\n'
                  '- Linked client-account and Machine API token management references to `https://my.mssv.ir/` and the relevant client-area routes.\n'
                  '- Added safe server-side intended-destination handling so customers return to the originally requested internal page after successful login and any required verification.\n'
                  '- Updated the OpenAPI contract to remove the obsolete `429 RateLimited` response from the current no-RPM-limit Machine API policy.\n\n'
              )
              if anchor not in s:
                  raise SystemExit('changelog current-base anchor missing')
              s=s.replace(anchor,anchor+block,1)
          s=rep(s,'Added cURL examples and links to the official MSSV website at `https://mssv.ir/`.',f'Added cURL examples and links to the official MSSV website at {site}.')
          write(p,s)

          # OpenAPI. API server transformation must happen before the broad site URL transformation.
          p='openapi/openapi.yaml'; s=read(p)
          s=rep(s,'  version: 1.0.0','  version: 1.1.0')
          s=rep(s,'url: https://mssv.ir/api/machine/v1','url: https://api.mssv.ir/v1')
          s=rep(s,'url: https://api.mssv.ir/api/machine/v1','url: https://api.mssv.ir/v1')
          s=rep(s,'url: https://www.mssv.ir/api/machine/v1','url: https://api.mssv.ir/v1')
          s=rep(s,'Official website: https://mssv.ir/',f'Official website: {site}')
          s=rep(s,'url: https://mssv.ir/','url: https://www.mssv.ir/')
          s=s.replace("        '429': {$ref: '#/components/responses/RateLimited'}\n",'')
          rate_block=(
              "    RateLimited:\n"
              "      description: Effective API rate limit exceeded\n"
              "      content:\n"
              "        application/json:\n"
              "          schema: {$ref: '#/components/schemas/Error'}"
          )
          s=s.replace(rate_block,'')
          write(p,s)

          # Final contract assertions.
          current_docs=[
              'README.md','docs/getting-started.md','docs/authentication.md','docs/errors.md',
              'docs/api-reference.md','docs/versioning.md','examples/curl.md','SECURITY.md'
          ]
          for f in current_docs:
              t=read(f)
              if 'https://mssv.ir/' in t:
                  raise SystemExit(f'legacy main-site href remained in {f}')
              if 'https://api.mssv.ir/api/machine/v1' in t:
                  raise SystemExit(f'legacy API base remained in current docs: {f}')

          readme=read('README.md')
          assert site in readme
          assert '`https://api.mssv.ir/v1/`' in readme
          assert 'https://my.mssv.ir/machine-users/' in readme

          gs=read('docs/getting-started.md')
          assert 'https://my.mssv.ir/machine-users/' in gs
          assert 'https://my.mssv.ir/login/' in gs
          assert 'returns you to the internal page you originally requested' in gs

          sec=read('SECURITY.md')
          assert 'mandatory IP/CIDR allowlist' in sec
          assert 'optional IP/CIDR allowlist' not in sec

          o=read('openapi/openapi.yaml')
          assert '  - url: https://api.mssv.ir/v1\n' in o
          assert 'https://www.mssv.ir/' in o
          assert 'https://mssv.ir/' not in o
          assert 'https://www.mssv.ir/api/machine/v1' not in o
          assert "'429': {$ref: '#/components/responses/RateLimited'}" not in o
          assert '    RateLimited:' not in o
          assert '  version: 1.1.0' in o

          c=read('CITATION.cff')
          assert 'url: https://www.mssv.ir/' in c
          assert 'version: 1.1.0' in c

          ch=read('CHANGELOG.md')
          assert 'The public API is served from `https://api.mssv.ir/v1/`.' in ch
          assert 'Canonical `/v1/` base path and client return flow' in ch

          print('DOCS_CANONICAL_API_V1_VALIDATED=1')
          PY

      - name: Commit public documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mssvir-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md CHANGELOG.md CITATION.cff SECURITY.md docs examples openapi/openapi.yaml
          if git diff --cached --quiet; then
            echo 'DOCS_NO_CHANGES=1'
            exit 0
          fi
          git commit -m 'docs: canonicalize API v1, website and client links'
          git push origin HEAD:main
