name: Sync canonical API v1 documentation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-canonical-api-v1-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Update public documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def rep(text, old, new):
              return text.replace(old, new)

          # README
          p='README.md'; s=read(p)
          s=rep(s,'[![Website](https://img.shields.io/badge/Website-mssv.ir-0b7285)](https://mssv.ir/)','[![Website](https://img.shields.io/badge/Website-www.mssv.ir-0b7285)](https://www.mssv.ir/)')
          s=rep(s,'[![API](https://img.shields.io/badge/API-api.mssv.ir-2f9e44)](https://api.mssv.ir/)','[![API](https://img.shields.io/badge/API-api.mssv.ir%2Fv1-2f9e44)](https://api.mssv.ir/v1/)')
          s=rep(s,'**Official website:** https://mssv.ir/','**Official website:** [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'**API base URL:** `https://api.mssv.ir/api/machine/v1`','**API base URL:** `https://api.mssv.ir/v1/`')
          s=rep(s,'https://api.mssv.ir/api/machine/v1/me','https://api.mssv.ir/v1/me')
          s=rep(s,'Create a Machine API token from your MSSV client account, assign at least one allowed IPv4/IPv6 address or CIDR range to that token, then send it as a Bearer token from an allowed source address:',
                'Create a Machine API token from [Machine API token management](https://my.mssv.ir/machine-users/), assign at least one allowed IPv4/IPv6 address or CIDR range to that token, then send it as a Bearer token from an allowed source address:')
          s=rep(s,'- versioned paths under `/api/machine/v1`','- versioned paths under `/v1/`')
          s=rep(s,'Customers can update the allowed IP/CIDR list for an active Machine API token from the authenticated MSSV client area. Origin allowlist reconciliation is automatic.',
                'Customers can update the allowed IP/CIDR list for an active Machine API token from [Machine API token management](https://my.mssv.ir/machine-users/). Origin allowlist reconciliation is automatic.')
          s=rep(s,'**[mssv.ir](https://mssv.ir/)**','**[www.mssv.ir](https://www.mssv.ir/)**')
          write(p,s)

          # Getting started
          p='docs/getting-started.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'https://api.mssv.ir/api/machine/v1\n```','https://api.mssv.ir/v1/\n```')
          s=rep(s,'Sign in to your MSSV client account and create a Machine API token from the API token management page. Token creation requires a current-password check. The token is displayed once, so store it securely.',
                'Open [Machine API token management](https://my.mssv.ir/machine-users/). If you are not signed in, use the [MSSV client area sign-in](https://my.mssv.ir/login/). After successful login and any required account verification, MSSV returns you to the page you originally requested. Token creation requires a current-password check. The token is displayed once, so store it securely.')
          s=rep(s,'You can later edit the token name, scopes and allowed IP/CIDR list from the authenticated MSSV client area without rotating the token. Allowlist reconciliation at the API origin is automatic.',
                'You can later edit the token name, scopes and allowed IP/CIDR list from [Machine API token management](https://my.mssv.ir/machine-users/) without rotating the token. Allowlist reconciliation at the API origin is automatic.')
          s=rep(s,'https://api.mssv.ir/api/machine/v1/','https://api.mssv.ir/v1/')
          s=rep(s,'For current MSSV product and service information, visit https://mssv.ir/.','For current MSSV product and service information, visit [www.mssv.ir](https://www.mssv.ir/).')
          write(p,s)

          # Authentication
          p='docs/authentication.md'; s=read(p)
          s=rep(s,'Base URL: `https://api.mssv.ir/api/machine/v1`','Base URL: `https://api.mssv.ir/v1/`')
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'Machine API tokens are issued from the authenticated MSSV client area and are shown only once at creation time.',
                'Machine API tokens are issued from [Machine API token management](https://my.mssv.ir/machine-users/) and are shown only once at creation time.')
          s=rep(s,'The token owner can edit its name, scopes and IP/CIDR allowlist from the authenticated MSSV client area. These changes are audited and the origin allowlist is reconciled automatically.',
                'The token owner can edit its name, scopes and IP/CIDR allowlist from [Machine API token management](https://my.mssv.ir/machine-users/). These changes are audited and the origin allowlist is reconciled automatically.')
          s=rep(s,'Official MSSV website: https://mssv.ir/','Official MSSV website: [www.mssv.ir](https://www.mssv.ir/)')
          write(p,s)

          # Errors
          p='docs/errors.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'API base URL: `https://api.mssv.ir/api/machine/v1`','API base URL: `https://api.mssv.ir/v1/`')
          write(p,s)

          # Reference
          p='docs/api-reference.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'Base URL: `https://api.mssv.ir/api/machine/v1`','Base URL: `https://api.mssv.ir/v1/`')
          s=rep(s,'Those capabilities require an authenticated human browser session.','Those capabilities require an authenticated browser session in the [MSSV client area](https://my.mssv.ir/).')
          s=rep(s,'The customer can edit this allowlist from the MSSV client area.','The customer can edit this allowlist from [Machine API token management](https://my.mssv.ir/machine-users/).')
          write(p,s)

          # Versioning
          p='docs/versioning.md'; s=read(p)
          s=rep(s,'https://mssv.ir/api/machine/v1','https://api.mssv.ir/v1/')
          if '## Legacy path compatibility' not in s:
              marker='## Compatibility\n'
              block='## Legacy path compatibility\n\nThe previous `/api/machine/v1` path is retained as a method-preserving HTTP `308` redirect to the canonical `/v1/` path. New integrations should use `https://api.mssv.ir/v1/` directly.\n\n'
              s=s.replace(marker,block+marker,1)
          s=rep(s,'The official MSSV website is https://mssv.ir/.','The official MSSV website is [www.mssv.ir](https://www.mssv.ir/).')
          write(p,s)

          # cURL examples
          p='examples/curl.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,"export MSSV_API_BASE='https://api.mssv.ir/api/machine/v1'","export MSSV_API_BASE='https://api.mssv.ir/v1'")
          s=rep(s,"update the Machine API token's IP/CIDR allowlist from the authenticated MSSV client area before sending requests from the new address.",
                "update the Machine API token's IP/CIDR allowlist from [Machine API token management](https://my.mssv.ir/machine-users/) before sending requests from the new address.")
          s=rep(s,'For product, hosting and account access information, visit https://mssv.ir/.','For product, hosting and account access information, visit [www.mssv.ir](https://www.mssv.ir/).')
          write(p,s)

          # Security policy
          p='SECURITY.md'; s=read(p)
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'Use the official MSSV website and support channels at https://mssv.ir/ to report security-sensitive issues privately.',
                'Use the support channels available through [www.mssv.ir](https://www.mssv.ir/) to report security-sensitive issues privately.')
          s=rep(s,'- Use the optional IP/CIDR allowlist where practical.','- Keep the mandatory IP/CIDR allowlist restricted to the smallest practical source range.')
          s=rep(s,'- Revoke tokens that are no longer needed.','- Manage and revoke tokens that are no longer needed from [Machine API token management](https://my.mssv.ir/machine-users/).')
          write(p,s)

          # Citation metadata
          p='CITATION.cff'; s=read(p)
          s=rep(s,'version: 1.0.0','version: 1.1.0')
          s=rep(s,'url: https://mssv.ir/','url: https://www.mssv.ir/')
          write(p,s)

          # Changelog: preserve the old path in historical entries, but make the
          # current contract explicit and record the compatibility behavior.
          p='CHANGELOG.md'; s=read(p)
          s=rep(s,'The public API is served from `https://api.mssv.ir/api/machine/v1`.','The public API is served from `https://api.mssv.ir/v1/`.')
          if 'Canonical `/v1/` base path and client return flow' not in s:
              anchor='The public API is served from `https://api.mssv.ir/v1/`.\n\n'
              block='''## 2026-09-17 — Canonical `/v1/` base path and client return flow\n\n- Changed the canonical public Machine API base URL to `https://api.mssv.ir/v1/`.\n- Kept `/api/machine/v1` as a method-preserving HTTP `308` compatibility redirect to `/v1/`.\n- Standardized official website links to [www.mssv.ir](https://www.mssv.ir/).\n- Linked client-account and Machine API token management references to `https://my.mssv.ir/` and the relevant client-area routes.\n- Added safe server-side intended-destination handling so customers return to the originally requested internal page after successful login and any required verification.\n- Updated the OpenAPI contract to remove the obsolete `429 RateLimited` response from the current no-RPM-limit Machine API policy.\n\n'''
              s=s.replace(anchor,anchor+block,1)
          s=rep(s,'Added cURL examples and links to the official MSSV website at `https://mssv.ir/`.','Added cURL examples and links to the official MSSV website at [www.mssv.ir](https://www.mssv.ir/).')
          write(p,s)

          # OpenAPI contract
          p='openapi/openapi.yaml'; s=read(p)
          s=rep(s,'  version: 1.0.0','  version: 1.1.0')
          s=rep(s,'Official website: https://mssv.ir/','Official website: [www.mssv.ir](https://www.mssv.ir/)')
          s=rep(s,'url: https://mssv.ir/','url: https://www.mssv.ir/')
          s=rep(s,'url: https://mssv.ir/api/machine/v1','url: https://api.mssv.ir/v1')
          s=rep(s,'url: https://api.mssv.ir/api/machine/v1','url: https://api.mssv.ir/v1')
          rate_line="        '429': {$ref: '#/components/responses/RateLimited'}\n"
          s=s.replace(rate_line,'')
          rate_block="""    RateLimited:\n      description: Effective API rate limit exceeded\n      content:\n        application/json:\n          schema: {$ref: '#/components/schemas/Error'}"""
          s=s.replace(rate_block,'')
          write(p,s)

          # Contract assertions: fail rather than publish inconsistent docs.
          docs=[
              'README.md','docs/getting-started.md','docs/authentication.md',
              'docs/errors.md','docs/api-reference.md','docs/versioning.md',
              'examples/curl.md','SECURITY.md','CHANGELOG.md'
          ]
          for f in docs:
              t=read(f)
              if 'https://mssv.ir/' in t:
                  raise SystemExit(f'legacy bare website URL remained in {f}')
          for f in ['README.md','docs/getting-started.md','docs/authentication.md','docs/errors.md','docs/api-reference.md','docs/versioning.md','examples/curl.md']:
              t=read(f)
              if 'https://api.mssv.ir/api/machine/v1' in t:
                  raise SystemExit(f'legacy API base remained in current docs: {f}')
          o=read('openapi/openapi.yaml')
          assert '  - url: https://api.mssv.ir/v1\n' in o
          assert "'429': {$ref: '#/components/responses/RateLimited'}" not in o
          assert '    RateLimited:' not in o
          assert 'https://mssv.ir/' not in o
          assert 'https://www.mssv.ir/' in o
          assert '[www.mssv.ir](https://www.mssv.ir/)' in read('README.md')
          assert 'https://my.mssv.ir/machine-users/' in read('docs/getting-started.md')
          assert 'https://my.mssv.ir/login/' in read('docs/getting-started.md')
          print('DOCS_CANONICAL_V1_SYNC_OK=1')
          PY

      - name: Commit documentation update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mssvir-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md CHANGELOG.md CITATION.cff SECURITY.md docs examples openapi/openapi.yaml
          if git diff --cached --quiet; then
            echo 'DOCS_NO_CHANGES=1'
            exit 0
          fi
          git commit -m 'docs: canonicalize API v1 and client links'
          git push origin HEAD:main
