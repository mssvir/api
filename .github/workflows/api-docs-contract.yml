name: API documentation current-contract guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate current Production OpenAPI and documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e openapi/openapi-preview.yaml
          test ! -e docs/api-preview.md

          ruby <<'RUBY'
          require 'yaml'
          methods=%w[get post put patch delete options head trace]
          current=YAML.load_file('openapi/openapi.yaml')
          raise 'openapi_version' unless current['openapi']=='3.1.0'
          raise "contract_version=#{current.dig('info','version')}" unless current.dig('info','version')=='1.4.0'
          ops={}
          current.fetch('paths').each do |path,item|
            item.each do |method,op|
              next unless methods.include?(method)
              params=Array(op['parameters'])
              idem=params.any?{|p| p.is_a?(Hash) && p['$ref']=='#/components/parameters/IdempotencyKey'}
              ops[[method.upcase,path]]={'scope'=>op['x-mssv-scope'],'idempotency'=>idem}
            end
          end
          raise "operation_count=#{ops.length}" unless ops.length==53
          expected={
            ['GET','/capabilities']=>{'scope'=>'account:read','idempotency'=>false},
            ['GET','/services/{id}/teaspeak']=>{'scope'=>'services:read','idempotency'=>false},
            ['GET','/services/{id}/teaspeak/clients']=>{'scope'=>'services:read','idempotency'=>false},
            ['GET','/services/{id}/teaspeak/channels']=>{'scope'=>'services:read','idempotency'=>false},
            ['GET','/services/{id}/teaspeak/ports']=>{'scope'=>'services:read','idempotency'=>false},
            ['POST','/services/{id}/teaspeak/ports']=>{'scope'=>'services:manage','idempotency'=>true},
            ['GET','/services/{id}/teaspeak/whitelist']=>{'scope'=>'services:read','idempotency'=>false},
            ['POST','/services/{id}/teaspeak/whitelist']=>{'scope'=>'services:manage','idempotency'=>true},
            ['POST','/services/{id}/teaspeak/whitelist/{rule_id}']=>{'scope'=>'services:manage','idempotency'=>true},
            ['DELETE','/services/{id}/teaspeak/whitelist/{rule_id}']=>{'scope'=>'services:manage','idempotency'=>true},
            ['POST','/services/{id}/radio/ip']=>{'scope'=>'services:manage','idempotency'=>true},
            ['GET','/services/{id}/radio/endpoints']=>{'scope'=>'services:read','idempotency'=>false}
          }
          expected.each{|k,v| raise "extension_contract_mismatch:#{k.join(' ')}" unless ops[k]==v}
          puts "CURRENT_PRODUCTION_OPERATIONS=#{ops.length}"
          RUBY

          grep -Fq 'current production 53-operation contract' docs/api-reference.md
          grep -Fq '53-operation' README.md
          grep -Fq 'No backward-compatibility layer is retained' docs/versioning.md
          ! grep -Fq '41-operation production specification' README.md
          ! grep -Fq 'not yet a production contract' docs/api-reference.md
          echo 'API_CURRENT_CONTRACT_GUARD_OK=1'
